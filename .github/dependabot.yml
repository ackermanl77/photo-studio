# Weekly PRs that raise dependency bounds deliberately (K3 in the improvement report): requirements
# carry upper bounds and constraints-*.txt pins exact versions, so nothing upgrades silently -- these
# PRs are how upgrades happen, each one gated by CI.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # sympy 1.14 (pinned in constraints-gpu.txt, required by torch) needs mpmath<1.4;
      # a newer pin would make the GPU-pack install unresolvable. Drop this with a sympy that allows it.
      - dependency-name: "mpmath"
        versions: [">=1.4"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
