name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Also callable from release.yml, so a release can't be built from a commit whose tests fail.
  workflow_call:

jobs:
  test:
    # The product ships for Windows and is built with Python 3.14; Linux/3.12 stays in the matrix as
    # the lowest supported combination.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Core requirements + pytest (and pytest-xdist) only -- requirements-raw.txt (rawpy) gets its own job below and
      # requirements-desktop.txt (pywebview/PyInstaller) is build-only: pywebview can need system
      # GTK/WebKit packages on Linux, and no test needs it (app.desktop imports it lazily).
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q app

      - name: Run tests
        run: python -m pytest -q -n auto

  raw-decode:
    # Exercises requirements-raw.txt's native packages, skipped in the main job: real LibRaw
    # decoding (a generated DNG, tests/synthetic_assets.py) and the lensfun lens lookup.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-raw.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-raw.txt
      - name: Decode a real RAW file and look up a lens
        run: python -m pytest -q tests/test_real_assets.py tests/test_lens_lookup.py

  audit:
    # Known vulnerabilities in the pinned/required Python packages (OSV / PyPI advisory data).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: pip-audit
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt -r requirements-desktop.txt --progress-spinner off
