name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to build (e.g. 0.1.0) -- no leading 'v'"
        required: true
        default: "0.2.0"
      gpu_pack:
        description: "Also build the optional GPU pack (AI Upscale; a multi-GB CUDA torch download) as a workflow artifact"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # The full CI test matrix must pass before anything is built or published.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The build interpreter the release is tested with (constraints-cpu.txt was verified on it).
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements-desktop.txt
            constraints-cpu.txt

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            # A tag push looks like "refs/tags/v0.1.0" -- strip the "v" prefix so both trigger
            # paths hand build_release.ps1 the same bare "0.1.0" shape it already expects.
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Ensure 7-Zip is available
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            choco install 7zip -y --no-progress
          }
          # build_release.ps1 looks for "7z" via Get-Command, which only sees what's already on
          # PATH in *this* process -- a fresh choco install above needs this added explicitly so
          # the later build step (a separate step, separate process) can find it too.
          "C:\Program Files\7-Zip" >> $env:GITHUB_PATH

      # Same steps scripts/build_release.ps1 already runs for a local release build: install
      # requirements-desktop.txt, PyInstaller, bundle the cached WebView2 Fixed Version runtime,
      # then archive to .7z + write its .sha256 sidecar (see that script's own comments for why
      # each piece exists -- this workflow is deliberately just "run the same script in CI").
      # The CPU base package (K5). The GPU pack is optional (manual runs only): it downloads CUDA
      # torch, and its archive can exceed GitHub's 2 GB release-asset limit, so it is kept as a
      # workflow artifact rather than attached to the release.
      - name: Build release
        shell: pwsh
        run: |
          $extra = @()
          if ("${{ github.event.inputs.gpu_pack }}" -eq "true") { $extra = @("-GpuPack", "-ExtraIndexUrl", "https://download.pytorch.org/whl/cu130") }
          .\scripts\build_release.ps1 -Version "${{ steps.version.outputs.value }}" @extra

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PhotoStudio-${{ steps.version.outputs.value }}-Windows
          path: |
            PhotoStudio-*-Windows.7z
            PhotoStudio-*-Windows.7z.sha256
          if-no-files-found: error

      - name: Upload GPU pack
        if: github.event.inputs.gpu_pack == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: PhotoStudio-${{ steps.version.outputs.value }}-GPU-pack
          path: |
            PhotoStudio-*-GPU-pack.7z
            PhotoStudio-*-GPU-pack.7z.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            PhotoStudio-*-Windows.7z PhotoStudio-*-Windows.7z.sha256 `
            --title "PhotoStudio ${{ github.ref_name }}" `
            --generate-notes

      # The update feed the app reads (update_check.py's UPDATE_FEED_URL is
      # https://github.com/<repo>/releases/latest/download/update.json, which GitHub
      # redirects to this asset of the newest release).
      - name: Publish the update feed (update.json)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $feed = [ordered]@{
            version = "${{ github.ref_name }}" -replace '^v', ''
            url = "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
            notes = ""
          }
          [IO.File]::WriteAllText("update.json", ($feed | ConvertTo-Json -Compress))
          gh release upload "${{ github.ref_name }}" update.json --clobber --repo "${{ github.repository }}"
