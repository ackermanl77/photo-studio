<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Photo Studio: a camera aperture with an edit slider across it (orange tile). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#e8590c"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <circle cx="128" cy="112" r="70" fill="#ffffff"/>
  <circle cx="128" cy="112" r="54" fill="#2b2f3a"/>
  <!-- iris: a hexagonal opening, each blade edge sweeping from a corner to the rim -->
