    <path d="M140 91.2 L119 59"/>
  </g>
  <path d="M152 112 L140 132.8 L116 132.8 L104 112 L116 91.2 L140 91.2 Z" fill="#ffd23c"/>
  <!-- the edit slider -->
  <rect x="44" y="198" width="168" height="14" rx="7" fill="#ffffff" opacity="0.55"/>
  <rect x="44" y="198" width="104" height="14" rx="7" fill="#ffffff"/>
  <circle cx="148" cy="205" r="19" fill="#ffffff"/>
  <circle cx="148" cy="205" r="9" fill="#e8590c"/>
