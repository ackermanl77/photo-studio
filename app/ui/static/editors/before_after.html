<div id="ba-root" class="ba-h" style="position:relative;width:100%;max-width:{{display_w}}px;margin:0 auto;background:var(--ps-canvas);
     border-radius:8px;overflow:hidden;line-height:0;touch-action:none;cursor:ew-resize;">
  <img src="data:image/png;base64,{{after_b64}}" style="display:block;width:100%;height:auto;" draggable="false">
  <img id="ba-before" src="data:image/png;base64,{{before_b64}}" draggable="false"
       style="position:absolute;inset:0;width:100%;height:100%;object-fit:fill;clip-path:inset(0 50% 0 0);">
  <div id="ba-handle"></div>
  <div class="ba-label" id="ba-label-before">{{label_before}}</div>
  <div class="ba-label" id="ba-label-after">{{label_after}}</div>
  <button type="button" id="ba-dir" title="{{label_dir}}" aria-label="{{label_dir}}">↕</button>
  <input id="ba-range" type="range" min="0" max="100" value="50" aria-label="{{label_range}}"
         style="position:absolute;left:8px;right:8px;bottom:10px;width:calc(100% - 16px);">
</div>
<style>
  #ba-handle { position:absolute; background:#fff; box-shadow:0 0 6px rgba(0,0,0,.7); pointer-events:none; }
  .ba-h #ba-handle { top:0; bottom:0; left:50%; width:2px; margin-left:-1px; }
  .ba-v #ba-handle { left:0; right:0; top:50%; height:2px; margin-top:-1px; }
  .ba-label { position:absolute; color:#fff; font:600 11px system-ui; text-shadow:0 1px 3px rgba(0,0,0,.8); letter-spacing:.05em; }
  #ba-label-before { top:8px; left:12px; }
  .ba-h #ba-label-after { top:8px; right:12px; }
  .ba-v #ba-label-after { bottom:40px; left:12px; }
  #ba-dir { position:absolute; top:6px; left:50%; transform:translateX(-50%); line-height:1; padding:4px 9px; border-radius:6px;
            border:1px solid var(--ps-border-soft); background:var(--ps-panel); color:var(--ps-text-strong); font:13px system-ui; cursor:pointer; }
  .ba-v { cursor:ns-resize !important; }
</style>
